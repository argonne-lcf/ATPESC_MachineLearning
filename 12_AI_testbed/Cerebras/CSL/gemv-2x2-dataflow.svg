<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="mg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,1 L8,4.5 L0,8 Z" fill="#5a6472"/></marker>
    <marker id="mt" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,1 L8,4.5 L0,8 Z" fill="#0e7490"/></marker>
    <marker id="ma" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,1 L8,4.5 L0,8 Z" fill="#b45309"/></marker>
  </defs>

  <rect x="0.5" y="0.5" width="719" height="469" rx="16" fill="#ffffff" stroke="#e4e8ee"/>

  <!-- host input arrows: x into top row, b into left column -->
  <g stroke="#5a6472" stroke-width="2" marker-end="url(#mg)" fill="none">
    <line x1="250" y1="92"  x2="250" y2="126"/>
    <line x1="510" y1="92"  x2="510" y2="126"/>
    <line x1="120" y1="175" x2="166" y2="175"/>
    <line x1="120" y1="335" x2="166" y2="335"/>
    <line x1="592" y1="175" x2="640" y2="175"/>
    <line x1="592" y1="335" x2="640" y2="335"/>
  </g>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#55607a" text-anchor="middle">
    <text x="250" y="80">x[0:3]</text>
    <text x="510" y="80">x[3:6]</text>
    <text x="92"  y="179">b[0:2]</text>
    <text x="92"  y="339">b[2:4]</text>
    <text x="672" y="179" fill="#157347" font-weight="700">y[0:2]</text>
    <text x="672" y="339" fill="#157347" font-weight="700">y[2:4]</text>
  </g>

  <!-- internal fabric flows -->
  <g stroke-width="2.5" fill="none">
    <line x1="250" y1="222" x2="250" y2="286" stroke="#0e7490" marker-end="url(#mt)"/>
    <line x1="510" y1="222" x2="510" y2="286" stroke="#0e7490" marker-end="url(#mt)"/>
    <line x1="332" y1="175" x2="426" y2="175" stroke="#b45309" marker-end="url(#ma)"/>
    <line x1="332" y1="335" x2="426" y2="335" stroke="#b45309" marker-end="url(#ma)"/>
  </g>

  <!-- PE tiles -->
  <g>
    <rect x="170" y="130" width="160" height="90" rx="12" fill="#f7f9fc" stroke="#b7c0d0" stroke-width="1.5"/>
    <rect x="430" y="130" width="160" height="90" rx="12" fill="#f7f9fc" stroke="#b7c0d0" stroke-width="1.5"/>
    <rect x="170" y="290" width="160" height="90" rx="12" fill="#f7f9fc" stroke="#b7c0d0" stroke-width="1.5"/>
    <rect x="430" y="290" width="160" height="90" rx="12" fill="#f7f9fc" stroke="#b7c0d0" stroke-width="1.5"/>
  </g>
  <g text-anchor="middle">
    <g fill="#14181f" font-size="16" font-weight="700">
      <text x="250" y="167">NW <tspan fill="#8892a6" font-weight="400" font-size="13">(0,0)</tspan></text>
      <text x="510" y="167">NE <tspan fill="#8892a6" font-weight="400" font-size="13">(1,0)</tspan></text>
      <text x="250" y="327">SW <tspan fill="#8892a6" font-weight="400" font-size="13">(0,1)</tspan></text>
      <text x="510" y="327">SE <tspan fill="#8892a6" font-weight="400" font-size="13">(1,1)</tspan></text>
    </g>
    <g fill="#55607a" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace">
      <text x="250" y="192">A[0–1, 0–2]</text>
      <text x="510" y="192">A[0–1, 3–5]</text>
      <text x="250" y="352">A[2–3, 0–2]</text>
      <text x="510" y="352">A[2–3, 3–5]</text>
    </g>
    <g fill="#8892a6" font-size="11" font-family="ui-monospace, Menlo, Consolas, monospace">
      <text x="250" y="208">y += A·x</text>
      <text x="510" y="208">y += A·x</text>
      <text x="250" y="368">y += A·x</text>
      <text x="510" y="368">y += A·x</text>
    </g>
  </g>

  <!-- legend -->
  <g font-size="12.5" font-family="ui-monospace, Menlo, Consolas, monospace">
    <line x1="150" y1="425" x2="182" y2="425" stroke="#0e7490" stroke-width="2.5" marker-end="url(#mt)"/>
    <text x="192" y="429" fill="#0e7490" font-weight="700">x_color</text>
    <text x="250" y="429" fill="#55607a"> — broadcast x south</text>

    <line x1="430" y1="425" x2="462" y2="425" stroke="#b45309" stroke-width="2.5" marker-end="url(#ma)"/>
    <text x="472" y="429" fill="#b45309" font-weight="700">ax_color</text>
    <text x="538" y="429" fill="#55607a"> — reduce y east</text>
  </g>
</svg>
