[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "atpesc-agentic-science"
version = "0.1.0"
description = "ATPESC 2026 module 08 — agentic AI for scientific workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ase>=3.23,<4",
    "globus-sdk>=3.40",
    "langchain-core>=1.2,<2",
    "langchain-mcp-adapters>=0.2,<1",
    "langchain-openai>=1.1,<2",
    "langgraph>=1.0,<2",
    "mcp>=1.16,<2",
    "pydantic>=2.10,<3",
    # Formerly optional; folded into the single install (see install.sh).
    "parsl>=2024.12",
    "aiosqlite>=0.20,<0.22",
    "langgraph-checkpoint-sqlite>=3.0",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

# MACE is intentionally not declared here. On Aurora it must be the XPU fork
# installed with --no-deps against Intel's system PyTorch; `install.sh` does that
# via `pip install --no-deps git+https://github.com/tdpham2/mace@alcf-dev`.
# Declaring `mace-torch` from PyPI would drag in an upstream CUDA torch.

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "integration: requires optional runtime services or dependencies",
    "mace: runs a real MACE model",
]
